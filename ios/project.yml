# The Xcode project of the iPad app, made by XcodeGen (`xcodegen` in this
# folder); build.sh does all steps.
name: MB3D
options:
  bundleIdPrefix: io.github.thr32423
  deploymentTarget:
    iOS: "17.0"
targets:
  MB3D:
    type: application
    platform: iOS
    # the UI tests run with the scheme's Test action (the workflow's
    # touch checks)
    scheme:
      testTargets: [MB3DUITests]
    sources:
      - path: App
      # the formula, map and example folders (made by build.sh, not kept in git)
      - path: Data
        type: folder
        buildPhase: resources
    # the file types and the Documents folder in the Files app (merged
    # with the generated keys below)
    info:
      path: Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        # no encryption beyond what iPadOS itself provides (no export questions per build)
        ITSAppUsesNonExemptEncryption: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.thr32423.orbittrap.m3p
            UTTypeDescription: Mandelbulb3D parameters
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [m3p]
          - UTTypeIdentifier: io.github.thr32423.orbittrap.m3f
            UTTypeDescription: Mandelbulb3D formula
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [m3f]
          - UTTypeIdentifier: io.github.thr32423.orbittrap.m3i
            UTTypeDescription: Mandelbulb3D picture
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [m3i]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mandelbulb3D parameters
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.github.thr32423.orbittrap.m3p, io.github.thr32423.orbittrap.m3i]
    settings:
      base:
        PRODUCT_NAME: OrbitTrap
        PRODUCT_BUNDLE_IDENTIFIER: io.github.thr32423.orbittrap
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/engine/include
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/engine/target/aarch64-apple-ios-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/engine/target/aarch64-apple-ios/release
        # the engine and what it needs (cargo --print native-static-libs)
        OTHER_LDFLAGS: "-lmb3d -liconv -lobjc -framework Metal -framework QuartzCore -framework CoreGraphics -framework Foundation -framework CoreFoundation"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Orbit Trap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: VZR9K6NY6T
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Saves your rendered pictures to Photos."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # touches the screenshots cannot show: dragging numbers, the slider's
  # fade, the light ball, the picture's gestures, and the windows that open
  # with a tap (UITests/; run by the workflow)
  MB3DUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MB3D
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.thr32423.orbittrap.uitests
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MB3D
