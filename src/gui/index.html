<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandelbulb 3D</title>
<style>
/* Layout after MB3D's main window (Mand.dfm): tool bar on top (Panel2),
   image (ScrollBox1), mouse-mode and rotation bar below (Panel3), and the
   parameter column on the right (Panel1).  Formulas, Lighting, Post
   processing, Navigator, Animation etc. are separate windows. */
:root {
  --bg: #15171c; --face: #23262d; --face2: #2b2f37; --face3: #333843; --line: #3d4350; --hi: #4a5161;
  --text: #dfe3ea; --dim: #8e96a6; --accent: #e0a24a; --accent2: #5aa0e6; --err: #ef6b6b; --ok: #79c37a;
  --input: #1b1d23; --shadow: 0 8px 28px rgba(0,0,0,.55);
}
:root.classic {
  --bg: #808080; --face: #f0f0f0; --face2: #e3e3e3; --face3: #d6d6d6; --line: #a0a0a0; --hi: #7a7a7a;
  --text: #111; --dim: #555; --accent: #0063b1; --accent2: #0063b1; --err: #c00; --ok: #2a7a2a;
  --input: #fff; --shadow: 0 6px 20px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 12px/1.3 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; overflow: hidden; }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--face3); border: 1px solid var(--line); border-radius: 3px; padding: 2px 7px; cursor: pointer; min-height: 21px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.down, button.on { background: var(--accent); color: #111; border-color: var(--accent); }
:root.classic button.down, :root.classic button.on { color: #fff; }
button.big { font-weight: 600; }
select, input[type=text], input[type=number], textarea { background: var(--input); border: 1px solid var(--line); border-radius: 2px; padding: 1px 4px; min-height: 20px; }
input[type=text] { width: 100%; min-width: 0; }
input[type=checkbox], input[type=radio] { margin: 0 4px 0 0; vertical-align: -2px; accent-color: var(--accent); }
input[type=color] { width: 36px; height: 20px; padding: 0; border: 1px solid var(--line); background: none; }
input[type=range] { accent-color: var(--accent); }
label { cursor: default; }
.dim { color: var(--dim); }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; word-break: break-all; }
kbd { background: var(--face3); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; font-size: 10px; }

#app { display: grid; grid-template-columns: 1fr 268px; grid-template-rows: auto 1fr auto; height: 100%; }
/* ---- top bar (Panel2) */
#top { grid-column: 1; grid-row: 1; display: flex; gap: 6px; align-items: stretch; padding: 3px 4px; background: var(--face);
  border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; }
#tools { display: grid; grid-template-columns: repeat(3, 62px); grid-template-rows: 30px 30px; gap: 3px; flex: none; }
#tools button { padding: 0 2px; font-size: 11px; }
.pc { display: flex; flex-direction: column; flex: none; min-width: 300px; }
.pc .tabs { display: flex; gap: 1px; }
.pc .tabs button { border-radius: 3px 3px 0 0; border-bottom: 0; padding: 1px 8px; min-height: 18px; background: var(--face2); color: var(--dim); }
.pc .tabs button.on { background: var(--face3); color: var(--text); border-color: var(--line); }
.pc .page { flex: 1; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; padding: 4px; border: 1px solid var(--line); background: var(--face3); }
.gb { border: 1px solid var(--line); border-radius: 3px; padding: 6px 5px 3px; margin-top: 7px; position: relative; flex: none; display: flex; gap: 4px; align-items: center; }
.gb > .cap { position: absolute; top: -7px; left: 6px; background: var(--face); padding: 0 3px; color: var(--dim); font-size: 11px; }
#imgBox { display: grid; grid-template-columns: auto 58px auto 58px auto; gap: 2px 4px; align-items: center; }
#imgBox input[type=text] { width: 58px; }
/* ---- image (ScrollBox1) */
#view { grid-column: 1; grid-row: 2; position: relative; overflow: auto; background: #0b0c0f; outline: none; min-height: 0; }
#view.fit { overflow: hidden; display: flex; align-items: center; justify-content: center; }
#img { display: block; user-select: none; -webkit-user-drag: none; image-rendering: auto; }
#view.fit #img { width: 100%; height: 100%; object-fit: contain; }
#view:not(.fit) #img { margin: 0; }
#view.m-zoom #img, #view.m-pick #img { cursor: crosshair; }
#view.m-xy #img { cursor: move; }
#view.m-z #img { cursor: ns-resize; }
#view.m-walk #img { cursor: pointer; }
#sel { position: absolute; border: 1px dashed #fff; mix-blend-mode: difference; pointer-events: none; display: none; }
#toast { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: #4a1f22; color: #ffd5d5; border: 1px solid var(--err);
  padding: 5px 10px; border-radius: 4px; display: none; max-width: 80%; white-space: pre-wrap; z-index: 5; cursor: pointer; }
#hint { position: absolute; left: 8px; top: 6px; background: rgba(0,0,0,.6); color: #ffe2a8; padding: 3px 8px; border-radius: 3px; display: none; pointer-events: none; }
/* ---- bottom bar (Panel3) */
#bottom { grid-column: 1; grid-row: 3; display: flex; gap: 6px; align-items: center; padding: 3px 4px; background: var(--face); border-top: 1px solid var(--line);
  flex-wrap: wrap; }
#bottom .grp { display: flex; gap: 2px; align-items: center; }
#rot { display: grid; grid-template-columns: 22px 22px 22px 22px; grid-template-rows: 15px 15px; gap: 1px; }
#rot button { min-height: 0; padding: 0; font-size: 10px; line-height: 13px; }
#bottom input.deg { width: 38px; }
#progress { width: 130px; height: 14px; border: 1px solid var(--line); background: var(--input); position: relative; }
#progress div { position: absolute; inset: 0; width: 0; background: var(--accent); transition: width .15s; }
#stage { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 80px; }
#stage.err { color: var(--err); }
/* ---- right column (Panel1) */
#right { grid-column: 2; grid-row: 1 / 4; display: flex; flex-direction: column; background: var(--face); border-left: 1px solid var(--line); min-height: 0; overflow-y: auto; }
.fold { width: 100%; border-radius: 0; border-left: 0; border-right: 0; text-align: left; font-weight: 600; background: var(--face3); }
.fold::before { content: "▾ "; color: var(--dim); }
.fold.closed::before { content: "▸ "; }
.pnl { padding: 4px 6px; display: grid; grid-template-columns: 62px 1fr; gap: 3px 4px; align-items: center; }
.pnl > .full { grid-column: 1 / 3; }
.pnl > label, .pnl > .lab { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pnl button.lab { color: var(--text); padding: 0 3px; }
.row2 { display: flex; gap: 3px; align-items: center; }
.row2 > * { flex: 1; }
#calcPnl { padding: 4px 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
#calcPnl .calc3d { grid-row: span 2; font-size: 13px; font-weight: 700; }
#calcPnl .q { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
#calcPnl .q button { padding: 0; font-size: 11px; }
#rtabs { display: flex; flex-wrap: wrap; gap: 1px; padding: 4px 4px 0; }
#rtabs button { border-radius: 3px 3px 0 0; padding: 1px 5px; min-height: 18px; font-size: 11px; background: var(--face2); color: var(--dim); border-bottom: 0; }
#rtabs button.on { background: var(--face3); color: var(--text); }
#rpage { margin: 0 4px; border: 1px solid var(--line); background: var(--face3); padding: 5px; min-height: 120px; }
#rpage .pnl { padding: 0; grid-template-columns: 1fr 72px; }
#rpage .pnl > input[type=text] { width: 72px; }
#memo { margin: 6px 4px 2px; height: 96px; overflow-y: auto; background: var(--input); border: 1px solid var(--line); padding: 3px 4px; font-size: 11px; flex: none; }
#memo div { margin: 1px 0; }
#memo .e { color: var(--err); }
#memo .n { color: var(--dim); }
#status2 { padding: 2px 6px 6px; color: var(--dim); font-size: 11px; }
/* ---- windows */
.win { position: fixed; background: var(--face); border: 1px solid var(--hi); border-radius: 5px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-width: 220px; max-height: calc(100vh - 8px); z-index: 10; }
.win .wt { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; background: var(--face3); border-bottom: 1px solid var(--line);
  border-radius: 5px 5px 0 0; cursor: move; user-select: none; font-weight: 600; }
.win.top .wt { background: color-mix(in srgb, var(--accent) 35%, var(--face3)); }
.win .wt span { flex: 1; }
.win .wt button { min-height: 18px; padding: 0 6px; }
.win .wb { overflow-y: auto; padding: 6px; flex: 1; }
.tabs2 { display: flex; flex-wrap: wrap; gap: 1px; }
.tabs2 button { border-radius: 3px 3px 0 0; border-bottom: 0; padding: 1px 7px; background: var(--face2); color: var(--dim); }
.tabs2 button.on { background: var(--face3); color: var(--text); }
.page2 { border: 1px solid var(--line); background: var(--face3); padding: 6px; margin-bottom: 6px; }
.grid { display: grid; grid-template-columns: 120px 1fr; gap: 3px 6px; align-items: center; }
.grid > label, .grid > .lab { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid > .full { grid-column: 1 / 3; }
.grid input[type=text].n { width: 90px; }
.tb { display: grid; grid-template-columns: 100px 1fr 54px; gap: 2px 6px; align-items: center; }
.tb > label { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb input[type=range] { width: 100%; }
.tb input[type=text] { width: 54px; }
.bar { height: 6px; background: var(--input); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin: 5px 0; }
.bar div { height: 100%; width: 0; background: var(--accent); }
.btns { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
.btns input[type=text] { width: 70px; }
.sect { font-weight: 600; margin: 8px 0 4px; color: var(--accent); }
.hint { color: var(--dim); font-size: 11px; margin: 3px 0 5px; }
.flist { position: fixed; z-index: 1000; background: var(--face); border: 1px solid var(--hi); box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto;
  display: grid; grid-auto-flow: column; grid-template-rows: repeat(var(--rows, 30), auto); column-gap: 8px; padding: 3px; }
.flist div { padding: 1px 6px; cursor: pointer; white-space: nowrap; }
.flist div:hover { background: var(--accent); color: #111; }
.palbar { height: 18px; border: 1px solid var(--line); border-radius: 2px; cursor: pointer; }
.pal { display: grid; grid-template-columns: 58px 36px 36px 40px; gap: 2px 5px; align-items: center; }
.pal input[type=text] { width: 58px; }
.swatches { display: flex; gap: 3px; align-items: center; }
.kf { display: grid; grid-template-columns: 96px 1fr; gap: 3px 8px; align-items: center; padding: 4px; border: 1px solid var(--line); border-radius: 4px; margin-bottom: 4px; background: var(--face3); }
.kf.sel { border-color: var(--accent2); }
.kf .th { width: 92px; height: 70px; background: #0b0c0f; display: flex; align-items: center; justify-content: center; grid-row: span 2; overflow: hidden; cursor: pointer; }
.kf .th img { max-width: 92px; max-height: 70px; }
.kf .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kf .meta b { color: var(--accent); }
.kf .meta input { width: 50px; }
.kf .btns button { padding: 0 5px; font-size: 11px; }
#flipImg, #mcImg { display: block; max-width: 100%; margin: 6px auto; background: #0b0c0f; min-height: 30px; }
#voxImg { display: block; width: min(220px, 100%); margin: 6px auto; background: #0b0c0f; min-height: 30px; image-rendering: pixelated; }
.mtree { position: relative; width: 100%; background: #0b0c0f; border-radius: 4px; margin: 6px 0; }
.mtree svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mtree .mm { position: absolute; transform: translate(-50%, -50%); border: 1px solid var(--line); border-radius: 3px; background: var(--face); cursor: pointer; overflow: hidden; }
.mtree .mm img { display: block; width: 100%; }
.mtree .mm span { position: absolute; left: 2px; top: 1px; font-size: 10px; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.mtree .mm.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mtree .mm.wait { aspect-ratio: 5 / 4; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 10px; }
textarea { width: 100%; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--input); }
.ppbtn { width: 100%; text-align: left; border-radius: 0; margin-top: -1px; font-weight: 600; }
.ppbtn::before { content: "▸ "; color: var(--dim); }
.ppbtn.open::before { content: "▾ "; }
.pppnl { border: 1px solid var(--line); border-top: 0; background: var(--face3); padding: 6px; }
/* panels of the tool windows */
.card { border: 1px solid var(--line); background: var(--face3); padding: 6px; margin-bottom: 6px; border-radius: 3px; }
.card h3 { margin: 0 0 5px; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.card h3 .sp { flex: 1; }
.row { display: grid; grid-template-columns: 140px 1fr; gap: 5px; align-items: center; margin: 2px 0; }
.row > label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.multi { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.multi input[type=text] { width: 70px; }
.addrow { display: flex; gap: 4px; margin-top: 5px; align-items: center; }
.flipctl { display: flex; gap: 6px; align-items: center; }
.flipctl input[type=range] { flex: 1; }
button.primary { background: var(--accent); color: #111; border-color: var(--accent); }
dialog { background: var(--face); color: var(--text); border: 1px solid var(--hi); border-radius: 6px; min-width: 360px; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog h3 { margin: 0 0 8px; }
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto auto; overflow-y: auto; }
  #right { grid-column: 1; grid-row: 4; overflow: visible; }
  html, body { overflow: auto; }
}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="tools">
      <button data-win="anim" title="Open the animation maker">Animations</button>
      <button data-win="btracer" title="Create meshes (BulbTracer2)">BTracer2</button>
      <button id="bHMap" disabled title="MB3D's height map generator (script editor) is not ported">HMapGen</button>
      <button data-win="navi" title="Open the Navigator">Navigator</button>
      <button data-win="muta" title="Open the MutaGen">MutaGen</button>
      <button data-win="zbuf" title="16 bit Z-buffer export">ZBuf16Bit</button>
    </div>
    <div class="pc" id="pc2">
      <div class="tabs"></div>
      <div class="page"></div>
    </div>
    <div class="gb" title="Image downscaling for viewing and for saving as PNG or JPEG; at 1:2 and 1:3 saving anti-aliases">
      <span class="cap">Viewing</span>
      <select id="viewScale"><option value="0">fit</option><option value="1">1:1</option><option value="2">1:2 aa</option><option value="3">1:3 aa</option>
        <option value="4">1:4</option><option value="5">1:5</option><option value="6">1:6</option><option value="8">1:8</option><option value="10">1:10</option></select>
    </div>
    <div class="gb"><span class="cap">Image</span>
      <div id="imgBox">
        <label>Width:</label><input type="text" id="iW">
        <label>Aspect:</label>
        <div class="row2"><button id="a43" title="Set the height for this aspect ratio">4:3</button><button id="a53">5:3</button></div>
        <button id="aUser" title="User defined aspect ratio (click to define)">user</button>
        <label>Height:</label><input type="text" id="iH">
        <label title="Keep the aspect ratio when changing the width or height"><input type="checkbox" id="keepAsp" checked>keep</label>
        <div class="row2" title="Scale the image size by 2, up or down"><button id="sDn">÷2</button><button id="sUp">×2</button></div>
        <label title="Scale the DE stop and the DOF clipping radius with the size to keep the detail level and colours"><input type="checkbox" id="desC" checked>DEstop+C</label>
      </div>
    </div>
  </div>

  <div id="view" class="fit m-walk" tabindex="0">
    <img id="img" alt="" draggable="false">
    <div id="sel"></div>
    <div id="hint"></div>
    <div id="toast"></div>
  </div>

  <div id="bottom">
    <div class="grp" id="modes">
      <button data-mode="walk" class="down" title="Navigator mode: click flies towards the point (or turns to it, see the Navigator), drag turns, wheel moves; keys W/S A/D R/F, arrows, Q/E">walk</button>
      <button data-mode="zoom" title="2D zoom: left click zooms in, right click out, or mark a zoom-in area">2D zoom</button>
      <button data-mode="xy" title="Shift the object in X,Y direction with the mouse">X,Y</button>
      <button data-mode="z" title="Move the object in Z direction with the mouse (drag up/down)">Z</button>
    </div>
    <div class="grp" title="Rotate the object: left click around the viewer's axes at the middle, right click around the object's axes at 0">
      <div id="rot">
        <button data-rot="2,1" title="Z axis +">Z+</button><button data-rot="1,-1" title="Y axis −" style="grid-row:span 2">◀Y</button>
        <button data-rot="0,1" title="X axis +">X▲</button><button data-rot="1,1" title="Y axis +" style="grid-row:span 2">Y▶</button>
        <button data-rot="2,-1" title="Z axis −">Z−</button><button data-rot="0,-1" title="X axis −">X▼</button>
      </div>
      <input type="text" id="rotDeg" class="deg" value="5" title="Degree of rotation">°
    </div>
    <div id="progress"><div></div></div>
    <span id="stage">starting…</span>
    <div class="grp" id="frameGrp" hidden title="Frame of the map sequences"><span class="dim">Frame:</span><input type="text" id="frame" class="deg" value="1"></div>
  </div>

  <div id="right">
    <button class="fold" data-fold="posPnl" title="Click to hide/show">Position</button>
    <div class="pnl" id="posPnl"></div>
    <button class="fold" data-fold="rotPnl" title="Click to hide/show">Rotation</button>
    <div class="pnl" id="rotPnl"></div>
    <div id="calcPnl">
      <div class="row2"><button id="bUndo" title="Undo (Ctrl+Z); right click: redo (Ctrl+Y)">↶</button><button id="bRedo" title="Redo">↷</button>
        <button id="bCalcMinus" title="Calculate a fast preview without the full settings">Calc-</button></div>
      <button data-win="formulas" title="Formula window">Formulas</button>
      <button id="bCalc3D" class="calc3d" title="Main rendering of the image (full size and settings)">Calculate 3D</button>
      <button data-win="lighting" title="Light and colour window">Lighting</button>
      <div></div>
      <button data-win="postpro" title="Post processing window">Postprocess</button>
      <div class="q" title="Quick quality settings (smooth normals, DE stop, raystep, binary search, size, viewing scale)">
        <button data-q="0">preview</button><button data-q="1">video</button><button data-q="2">mid</button><button data-q="3">high</button></div>
    </div>
    <div id="rtabs"></div>
    <div id="rpage"></div>
    <div id="memo" title="Messages"></div>
    <div id="status2"></div>
  </div>
</div>
<div id="wins"></div>
<input type="file" id="fileIn" hidden>

<dialog id="dPaste">
  <h3>Parameters from the clipboard</h3>
  <div class="hint">The browser did not allow reading the clipboard: paste MB3D text parameters (Mandelbulb3Dv18{…}) or a .m3s scene here.</div>
  <textarea id="pasteText" rows="12"></textarea>
  <div class="btns" style="justify-content:flex-end"><button id="pasteCancel">Cancel</button><button id="pasteOk" class="on">Load</button></div>
</dialog>
<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else e.setAttribute(k, v);
  }
  for (const k of kids) if (k !== null && k !== undefined && k !== false) e.append(k);
  return e;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem("mb3d." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("mb3d." + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};

// ------------------------------------------------------------ scene model
// The scene is .m3s text: global "key = value" lines, then [formula] and
// [light] sections.  Every control edits this list and sends the whole text
// back; the server answers with the normalised text.
let model = { global: [], sections: [] };
let sceneText = "", euler = null, notes = [];
let formulaNames = [], formulaDE = new Map();
let undoStack = [], redoStack = [];

function parseM3s(text) {
  const m = { global: [], sections: [] };
  let cur = m.global;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith("#") || line.startsWith("//")) continue;
    const sec = line.match(/^\[(\w+)\]$/);
    if (sec) { const s = { type: sec[1].toLowerCase(), lines: [] }; m.sections.push(s); cur = s.lines; continue; }
    const semi = line.indexOf(";");
    const body = semi >= 0 ? line.slice(0, semi) : line;
    const comment = semi >= 0 ? line.slice(semi + 1).trim() : "";
    const eq = body.indexOf("=");
    if (eq < 0) continue;
    cur.push({ k: body.slice(0, eq).trim(), v: body.slice(eq + 1).trim(), c: comment });
  }
  return m;
}

addEventListener("mouseup", async e => {

  const dx = e.clientX - d.x, dy = e.clientY - d.y, r = d.r;
  const W = gnum("width"), H = gnum("height");
  const k = W / r.width; // screen px -> image px
  $("sel").style.display = "none";

// MB3D's animation maker: keyframes are taken from the editor; the server
// interpolates the frames, renders a flipbook preview and the frame files.

  const structural = !anim || a.ver !== animVer;
  anim = a; animVer = a.ver;
  if (a.flip.gen !== flip.gen) { flip.gen = a.flip.gen; flip.cache = new Map(); flip.pos = 0; }
  if (isOpen("anim")) {
    const busy = document.activeElement && $("w_anim").contains(document.activeElement) && document.activeElement.tagName === "INPUT"
      && document.activeElement.type !== "range";
    if (structural && !busy) renderWin("anim"); else animUpdate();

function scheduleAnimPoll() {

}
async function animKey(op, extra = {}) {
  try {
    const r = await post("/api/anim/key", form({ op, ...extra }));

    setAnim(r.anim);

  let k = -1;
  anim.keys.forEach((key, j) => { if (key.first <= i) k = j; });
  if (k < 0) return "";
  const sub = Math.round((i - anim.keys[k].first) / Math.max(1, anim.index_step));

}
function flipShow(n) {
  const f = anim && anim.flip;

    el("div", { class: "row" }, el("label", {}, "z scale"), inp("zscale", "Slice spacing relative to the pixel size", "1")),
    el("div", { class: "row" }, el("label", { title: "Slice along the formula's x/y/z axes instead of the camera's view" }, "formula axes"), chk("axes")),
    el("div", { class: "row" }, el("label", {}, "folder"), inp("vfolder", "Relative to the server's working directory; a subfolder per scene")),
    el("div", { class: "multi" },
      el("button", { onclick: voxPrev, title: "All slices stacked, seen from the front" }, "Preview"),
      el("button", { class: "primary", id: "expVox", onclick: () => exportStart("voxel") }, "Write slices")),
    voxImg));
  if (kind === "mesh") p.append(el("div", { class: "card" }, el("h3", {}, "Mesh"),
    el("div", { class: "hint" }, "A triangle mesh by marching cubes over the distance estimate (MB3D's BulbTracer2): binary STL, OBJ or PLY. Vertex colours come from the scene's palette."),
    el("div", { class: "row" }, el("label", { title: "Grid cells per side of the cube; time and memory grow with its cube" }, "resolution"), inp("resolution")),
    el("div", { class: "row" }, el("label", { title: "0.5: the cube is twice the visible 2.2 / zoom; larger = smaller cube" }, "scale"), inp("scale")),
    el("div", { class: "row" }, el("label", { title: "Higher values make finer surfaces (and lower the DE stop)" }, "sharpness"), inp("sharpness")),
    el("div", { class: "row" }, el("label", {}, "format"), sel("format", [["stl", "STL (binary)"], ["obj", "OBJ"], ["ply", "PLY"]])),
    el("div", { class: "row" }, el("label", { title: "OBJ and PLY only" }, "vertex colours"), chk("colors")),
    el("div", { class: "row" }, el("label", { title: "Close the mesh where the object leaves the cube (for 3D printing)" }, "close at the cube"), chk("close")),
    el("div", { class: "row" }, el("label", { title: "Taubin smoothing passes (0 = off)" }, "smoothing passes"), inp("smooth")),
    el("div", { class: "multi" }, el("button", { class: "primary", id: "expMesh", onclick: () => exportStart("mesh") }, "Build mesh"))));
  p.append(el("div", { class: "card" }, el("h3", {}, "Progress"),

      el("a", { id: "expFile", href: "/api/export/file", hidden: "" }, el("button", { class: "primary" }, "Download " + (exp.file ? `${exp.file.name} (${(exp.file.size / 1048576).toFixed(1)} MB)` : ""))),

// ------------------------------------------------------------ Monte Carlo
// MB3D's Monte Carlo renderer: ambient bounces, soft shadows, reflections
// and transparency, refined pass by pass where the image is noisy.
let mcState = null, mcVer = -1, mcPollTimer = null, mcWasRunning = false;
const mcUi = { rays: "64", scale: "1" };
const MC_DEF = { mc_depth: "3", mc_reflections: "false", mc_reflection_depth: "1", mc_reflection_amount: "0.5",
  mc_transparency: "false", mc_only_difs: "false", mc_diffuse_reflects: "0", mc_soft_shadow_radius: "1", mc_exposure: "128",
  mc_saturation: "32", mc_options: "2", mc_refraction_index: "1.5", mc_absorption: "0.2", mc_scattering: "1" };
function mcVal(k) { const l = model && model.global.find(x => x.k === k); return l ? l.v : MC_DEF[k]; }
function mcSet(o) {
  for (const [k, v] of Object.entries(o)) {
    const l = model.global.find(x => x.k === k);
    if (l) l.v = String(v); else model.global.push({ k, v: String(v), c: "" });
  }
  // the scene only keeps the mc keys when one differs from the default: write them all
  for (const k of Object.keys(MC_DEF)) if (!model.global.find(x => x.k === k)) model.global.push({ k, v: MC_DEF[k], c: "" });
  commit();
}
async function mcLoad() { try { setMc(await api("/api/mc")); } catch (e) { showError(e.message); } }
function setMc(m) {
  const first = !mcState;
  const changed = first || m.ver !== mcVer;
  mcState = m; mcVer = m.ver;
  if (isOpen("mc")) { if (first || mcWasRunning !== m.running) renderWin("mc"); else if (changed) mcUpdate(); else mcProgress(); }
  mcWasRunning = m.running;
  clearTimeout(mcPollTimer);
  if (m.running || isOpen("mc")) mcPollTimer = setTimeout(mcLoad, m.running ? 700 : 2500);
}
function mcProgress() {
  const m = mcState; if (!m) return;
  const b = $("mcBar"); if (b) b.firstElementChild.style.width = (m.running ? m.progress : (m.passes ? 100 : 0)) + "%";
}
function mcUpdate() {
  const m = mcState; if (!m) return;
  mcProgress();
  const s = $("mcState");
  if (s) {
    let t = m.passes || m.running ? `${m.w} × ${m.h} · pass ${m.passes + (m.running ? 1 : 0)} · ${m.rays.toFixed(1)} rays per pixel (max ${m.max_rays}) · noise ${m.noise.toFixed(4)} · ${fmtTime(m.seconds)}` : "";
    if (m.running) t += ` · until ${m.target} rays`;
    if (m.error) t += " · " + m.error;
    s.textContent = t;
  }
  const im = $("mcImg");
  if (im && (m.passes || m.rays > 0)) { im.src = "/api/mc/img?v=" + m.ver + "&t=" + Date.now(); im.hidden = false; }
  for (const id of ["mcDl", "mcM3c"]) { const x = $(id); if (x) x.hidden = !(m.passes || m.rays > 0); }
  const c = $("mcCont"); if (c) c.disabled = m.running || !m.passes;
}
function mcTab(p) {
  if (!mcState) { p.append(el("div", { class: "hint" }, "loading…")); mcLoad(); return; }
  const m = mcState;
  const inp = (k, title, size) => {
    const e = el("input", { type: "text", id: "mc_" + k, value: mcVal(k), title: title || "", size: size || 6 });
    e.addEventListener("change", () => mcSet({ [k]: e.value }));
    return e;
  };
  const chk = (k, title) => {
    const e = el("input", { type: "checkbox", id: "mc_" + k, title: title || "" });
    e.checked = mcVal(k) === "true";
    e.addEventListener("change", () => mcSet({ [k]: e.checked }));
    return e;
  };
  const opts = +mcVal("mc_options") || 0;
  const bit = (b, title) => {
    const e = el("input", { type: "checkbox", title: title || "" });
    e.checked = (opts & b) !== 0;
    e.addEventListener("change", () => mcSet({ mc_options: e.checked ? opts | b : opts & ~b }));
    return e;
  };
  const row = (label, ctl, title) => el("div", { class: "row" }, el("label", { title: title || "" }, label), ctl);
  const slider = (k, max, title) => {
    const e = el("input", { type: "range", min: 0, max, value: mcVal(k), title: title || "", id: "mc_" + k });
    const v = el("span", { class: "hint" }, mcVal(k));
    e.addEventListener("input", () => { v.textContent = e.value; });
    e.addEventListener("change", () => mcSet({ [k]: e.value }));
    return el("div", { class: "multi" }, e, v);
  };
  const bokeh = el("select", { id: "mc_bokeh" }, ...[1, 2, 3, 4, 5, 6].map(n => el("option", { value: n }, ["disc", "disc, bright rim", "pentagon", "pentagon, bright rim", "heptagon", "heptagon, bright rim"][n - 1])));
  bokeh.value = String(((opts >> 4) & 7) + 1);
  bokeh.onchange = () => mcSet({ mc_options: (opts & 0x0F) | ((+bokeh.value - 1) << 4) });
  p.append(el("div", { class: "card" }, el("h3", {}, "Light paths"),
    el("div", { class: "hint" }, "Path tracing with the scene's lights, colours and background. Ambient light comes from bounces of light between the surfaces, lights get a size and cast soft shadows."),
    row("ambient bounces", inp("mc_depth"), "MCDepth: diffuse bounces (1 = ambient occlusion only)"),
    row("light size", inp("mc_soft_shadow_radius"), "Size of the light sources (soft shadows)"),
    row("reflections", chk("mc_reflections")),
    row("reflection depth", inp("mc_reflection_depth"), "Reflections and refractions of reflections ..."),
    row("reflection amount", inp("mc_reflection_amount"), "Amount of reflected light (the palette's specular colours); 0..1 is realistic"),
    row("diffuse reflections", inp("mc_diffuse_reflects"), "Rough reflections: 0 (sharp) .. 2.5"),
    row("transparency", chk("mc_transparency", "With reflections: the alpha of the palette's specular colours is the transparency")),
    row("only dIFS transparent", chk("mc_only_difs")),
    row("refraction index", inp("mc_refraction_index")),
    row("absorption", inp("mc_absorption"), "Light absorption inside transparent material (coloured by the diffuse colour)"),
    row("light scattering", inp("mc_scattering"), "Light scattered inside transparent material"),
    row("secant search", bit(2, "Finer surface search")),
    row("clip spec. + diffuse", bit(4, "Scale specular and diffuse colours down when they add up to more than 1")),
    row("gaussian anti-aliasing", bit(8)),
    row("bokeh shape", bokeh, "Depth of field aperture shape (Post processing ▸ Depth of Field)")));
  p.append(el("div", { class: "card" }, el("h3", {}, "Image"),
    row("exposure", slider("mc_exposure", 255), "128 = 1"),
    row("colour saturation", slider("mc_saturation", 127), "32 = 1"),
    row("HDR soft clipping", bit(1)),
    el("div", { class: "hint" }, "Exposure, saturation and soft clipping change the image without recalculating it; gamma is the one of the Lighting window.")));
  const rays = el("input", { type: "text", id: "mcRays", value: mcUi.rays, size: 5 });
  rays.onchange = () => { mcUi.rays = rays.value; };
  const scale = el("select", { id: "mcScale" }, ...[["1", "full size"], ["0.5", "1/2"], ["0.25", "1/4"]].map(([v, l]) => el("option", { value: v }, l)));
  scale.value = mcUi.scale; scale.onchange = () => { mcUi.scale = scale.value; };
  const start = async cont => { try { setMc(await post("/api/mc/start", form({ rays: rays.value, scale: scale.value, cont }))); } catch (e) { showError(e.message); } };
  const fi = el("input", { type: "file", accept: ".m3c", hidden: "" });
  fi.onchange = async () => {
    const f = fi.files[0]; if (!f) return;
    try { applyState(await post("/api/mc/open?name=" + encodeURIComponent(f.name), await f.arrayBuffer())); mcLoad(); }
    catch (e) { showError(e.message); }
  };
  p.append(el("div", { class: "card" }, el("h3", {}, "Render"),
    el("div", { class: "multi" }, el("span", { class: "hint" }, "until"), rays, el("span", { class: "hint" }, "rays per pixel"), scale),
    el("div", { class: "multi" },
      el("button", { class: "primary", id: "mcStart", disabled: m.running ? "" : null, onclick: () => start(false) }, "Start"),
      el("button", { id: "mcCont", title: "More rays for the image below", onclick: () => start(true) }, "Continue"),
      el("button", { onclick: async () => setMc(await post("/api/mc/stop", "")) }, "Stop")),
    el("div", { class: "bar", id: "mcBar" }, el("div")),
    el("div", { class: "hint", id: "mcState" }),
    el("a", { href: "/api/mc/img", target: "_blank", title: "Full size" }, el("img", { id: "mcImg", alt: "", hidden: "" })),
    el("div", { class: "multi" },
      el("a", { id: "mcDl", href: "/api/mc/img", download: "mc.png", hidden: "" }, el("button", {}, "Save PNG")),
      el("a", { id: "mcM3c", href: "/api/mc/m3c", hidden: "" }, el("button", { title: "MB3D's Monte Carlo file: continue later, here or in MB3D" }, "Save .m3c")),
      el("button", { onclick: () => fi.click() }, "Open .m3c…"), fi),
    el("div", { class: "hint" }, "Start renders the editor's scene: the first pass shoots 4 rays per pixel, every further pass adds rays where the image is still noisy. On the command line: mb3d montecarlo scene.m3p --rays 64")));
  mcUpdate();
}

defWin("anim", "Animation maker", 440, p => animTab(p), { selfRefresh: true, onopen: () => animLoad() });

defWin("btracer", "Bulb Tracer2", 400, p => exportTab(p, "mesh"), { selfRefresh: true, onopen: () => exportLoad() });

function doublePanel(d) { d.append(el("div", { class: "hint" }, "not ported yet")); }

async function loadFormulas() {
  const f = await api("/api/formulas");
  formulaNames = [...f.builtin, ...f.custom];
  formulaDE = new Map(formulaNames.map((n, i) => [n, f.de[i] ?? 0]));
  let dl = $("formulaList");
  if (!dl) { dl = el("datalist", { id: "formulaList" }); document.body.append(dl); }
  dl.textContent = "";
  for (const n of formulaNames) dl.append(el("option", { value: n }));
  if (isOpen("formulas")) renderWin("formulas");
}
(async () => {
  if (store.get("classic", false)) document.documentElement.classList.add("classic");
  try {
    await loadFormulas();
    applyState(await api("/api/state"), true);
    for (const id of store.get("open", [])) if (WINDOWS[id]) openWin(id);
    await sendView(true);
    msg("mb3d-rs editor. Open parameters (top left), edit them in the Formulas, Lighting and Post processing windows, and press \"Calculate 3D\".", "n");
  } catch (e) { showError(e); }
  poll();
})();
