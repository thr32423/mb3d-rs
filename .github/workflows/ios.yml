name: iPad app

# Builds the iPad app (ios/) on a Mac for the iPad Simulator, runs it with
# an example opened and keeps screenshots and its log (artifact
# ipad-screens): the app is developed without a Mac at hand. The testflight
# job builds it for real iPads, signs it with the App Store Connect API key
# (secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8) and uploads it to
# TestFlight; the build number is the workflow's run number.
on:
  push:
    branches: [ipad-app]
    paths: ["ios/**", "src/**", "Cargo.toml", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      example:
        description: "example file to open (name without .m3p)"
        default: "ABoxScale2Start"
      testflight:
        description: "also upload a build to TestFlight"
        type: boolean
        default: true
      showcase:
        description: "only showcase screenshots: the scenes of ios/showcase on a 13-inch iPad, upright and on its side"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/engine
      - name: XcodeGen
        run: brew install xcodegen
      # the formula, map and example folders of the latest release, checked
      # against its SHA256SUMS
      - name: Data of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          release=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag
          curl -sSfL -o rel.tar.gz $release/mb3d-rs-linux-x64.tar.gz
          curl -sSfL $release/SHA256SUMS | grep ' mb3d-rs-linux-x64.tar.gz$' | sed 's/mb3d-rs-linux-x64.tar.gz/rel.tar.gz/' > sum
          shasum -a 256 -c sum
          mkdir data && tar xzf rel.tar.gz -C data --strip-components=1 \
            "mb3d-rs-$tag-x86_64-unknown-linux-gnu/M3Formulas" "mb3d-rs-$tag-x86_64-unknown-linux-gnu/EM_JIT_M3Formulas" \
            "mb3d-rs-$tag-x86_64-unknown-linux-gnu/M3Maps" "mb3d-rs-$tag-x86_64-unknown-linux-gnu/M3Parameter"
      # the showcase scenes (own scenes on built-in formulas) join the
      # examples of this build only
      - name: Showcase scenes
        if: inputs.showcase
        run: cp ios/showcase/*.m3p data/M3Parameter/
      - name: Engine and project
        run: ios/build.sh "$PWD/data"
      - name: Build for the Simulator
        run: |
          cd ios
          xcodebuild -project MB3D.xcodeproj -target MB3D -configuration Release -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build | tail -40
          ls build/Release-iphonesimulator
      # pictures for showing the app: each scene finished (two minutes to
      # render), alone and with a settings page or window, upright and on
      # its side, with the clean status bar of Apple's own screenshots
      - name: Showcase
        if: inputs.showcase
        run: |
          mkdir -p screens
          udid=$(xcrun simctl list devices available | grep -m1 -E 'iPad Pro 13' | grep -oE '[0-9A-F-]{36}')
          echo "iPad: $(xcrun simctl list devices available | grep -m1 "$udid")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode notSupported
          xcrun simctl install "$udid" ios/build/Release-iphonesimulator/OrbitTrap.app
          shot() { # name, scene, [-page X | -sheet X]
            local name=$1 scene=$2; shift 2
            xcrun simctl terminate "$udid" io.github.thr32423.orbittrap || true
            xcrun simctl launch "$udid" io.github.thr32423.orbittrap -open "$scene" "$@"
            sleep 120
            xcrun simctl io "$udid" screenshot "screens/$name.png"
          }
          all() { # prefix
            for i in 1 2 3 4 5 6; do
              scene=$(ls ios/showcase | grep "^Orbit Trap $i - " | sed 's/\.m3p$//')
              shot "$1-$i-scene" "$scene"
            done
            shot "$1-7-lighting" "Orbit Trap 1 - Sunset sea" -page lighting
            shot "$1-8-colours" "Orbit Trap 3 - Lagoon" -page colours
            shot "$1-9-effects" "Orbit Trap 2 - Coral dusk" -page effects
            shot "$1-10-variations" "Orbit Trap 4 - Golden hour" -sheet variations
          }
          all portrait
          xcrun simctl terminate "$udid" io.github.thr32423.orbittrap || true
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          sleep 15
          osascript -e 'tell application "Simulator" to activate' -e 'delay 2' \
            -e 'tell application "System Events" to key code 124 using command down' \
            || echo "rotating the simulator failed (no accessibility access?)"
          sleep 5
          all landscape
          for f in screens/landscape-*.png; do sips -r 90 "$f" >/dev/null; done
          sips -g pixelWidth -g pixelHeight screens/portrait-1-scene.png screens/landscape-1-scene.png
      - name: Run on a simulated iPad
        if: ${{ !inputs.showcase }}
        run: |
          mkdir -p screens
          xcrun simctl list devices available > screens/devices.txt
          udid=$(xcrun simctl list devices available | grep -m1 -E 'iPad Pro|iPad Air|iPad' | grep -oE '[0-9A-F-]{36}')
          echo "iPad: $(grep -m1 "$udid" screens/devices.txt)"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" ios/build/Release-iphonesimulator/OrbitTrap.app
          # -demo moves the camera as gestures would (7 moves), changes
          # settings (2), saves, then effects, focus, undo, 16:9, paste (5); -snapshots
          # writes every full picture to the app's Documents folder
          xcrun simctl launch "$udid" io.github.thr32423.orbittrap -open "${{ inputs.example || 'ABoxScale2Start' }}" -demo -snapshots
          sleep 10
          xcrun simctl io "$udid" screenshot screens/start.png
          docs="$(xcrun simctl get_app_container "$udid" io.github.thr32423.orbittrap data)/Documents"
          for i in $(seq 1 480); do
            [ -f "$docs/montecarlo.png" ] && break
            sleep 5
          done
          sleep 3
          xcrun simctl io "$udid" screenshot screens/end.png
          cp "$docs"/picture-*.png screens/ || echo "no pictures in $docs"
          cp "$docs"/variation-*.png "$docs"/montecarlo.png screens/ || echo "no variations or Monte Carlo in $docs"
          cp "$docs"/droste.png "$docs"/stereo.png "$docs"/demo-* screens/ || echo "some phase 5 results missing"
          cp "$docs"/*.m3p screens/ || echo "no saved scene in $docs"
          ls screens
          xcrun simctl spawn "$udid" log show --last 40m --style compact --predicate 'process == "Mandelbulb3D"' > screens/app.log || true
          # the interface: every settings page and window
          ex="${{ inputs.example || 'ABoxScale2Start' }}"
          for page in picture fractal formulas julia lighting colours fog effects finishing ground; do
            xcrun simctl terminate "$udid" io.github.thr32423.orbittrap || true
            xcrun simctl launch "$udid" io.github.thr32423.orbittrap -open "$ex" -page "$page"
            sleep 25
            xcrun simctl io "$udid" screenshot "screens/ui-page-$page.png"
          done
          for sheet in variations animation model curves; do
            xcrun simctl terminate "$udid" io.github.thr32423.orbittrap || true
            xcrun simctl launch "$udid" io.github.thr32423.orbittrap -open "$ex" -sheet "$sheet"
            sleep 60
            xcrun simctl io "$udid" screenshot "screens/ui-sheet-$sheet.png"
          done
          # the iPad on its side: Simulator's Device > Rotate Right (cmd-right
          # arrow) turns the simulated iPad, as a person would; the app
          # cannot turn it itself
          xcrun simctl terminate "$udid" io.github.thr32423.orbittrap || true
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          sleep 15
          osascript -e 'tell application "Simulator" to activate' -e 'delay 2' \
            -e 'tell application "System Events" to key code 124 using command down' \
            || echo "rotating the simulator failed (no accessibility access?)"
          sleep 5
          xcrun simctl launch "$udid" io.github.thr32423.orbittrap -open "$ex"
          sleep 30
          xcrun simctl io "$udid" screenshot "screens/land-start.png"
          for page in formulas lighting colours effects; do
            xcrun simctl terminate "$udid" io.github.thr32423.orbittrap || true
            xcrun simctl launch "$udid" io.github.thr32423.orbittrap -open "$ex" -page "$page"
            sleep 25
            xcrun simctl io "$udid" screenshot "screens/land-page-$page.png"
          done
          for sheet in variations animation model; do
            xcrun simctl terminate "$udid" io.github.thr32423.orbittrap || true
            xcrun simctl launch "$udid" io.github.thr32423.orbittrap -open "$ex" -sheet "$sheet"
            sleep 60
            xcrun simctl io "$udid" screenshot "screens/land-sheet-$sheet.png"
          done
          # (the simulator keeps its picture upright, the app on its side in
          # it: a quarter turn to the right shows it as one sees the iPad)
          for f in screens/land-*.png; do sips -r 90 "$f" >/dev/null; done
          # the translations: German, and Arabic (right to left)
          for lang in de ar; do
            xcrun simctl terminate "$udid" io.github.thr32423.orbittrap || true
            xcrun simctl launch "$udid" io.github.thr32423.orbittrap -AppleLanguages "($lang)" -AppleLocale "$lang" -open "${{ inputs.example || 'ABoxScale2Start' }}"
            sleep 40
            xcrun simctl io "$udid" screenshot "screens/lang-$lang.png"
          done
          tail -30 screens/app.log
      # the touches (ios/UITests): built and run with the scheme's Test
      # action on the same simulated iPad; while a test holds a finger down
      # (screens/live-on), a picture of the screen every second
      - name: Touches
        if: ${{ !inputs.showcase }}
        continue-on-error: true
        run: |
          udid=$(xcrun simctl list devices booted | grep -oE '[0-9A-F-]{36}' | head -1)
          screens="$PWD/screens"
          ( while [ ! -f "$screens/.tests-done" ]; do
              if [ -f "$screens/live-on" ]; then
                xcrun simctl io "$udid" screenshot "$screens/live-$(date +%s)-$RANDOM.png" >/dev/null 2>&1
              fi
              sleep 1
            done ) &
          cd ios
          # (the shell stops at a failing command: the result is kept, the
          # frame loop ended and the attachments taken first)
          status=0
          TEST_RUNNER_SCREENS="$screens" xcodebuild test -project MB3D.xcodeproj -scheme MB3D \
            -destination "id=$udid" -resultBundlePath "$PWD/build/UITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO > "$screens/uitests.log" 2>&1 || status=$?
          grep -E "Test Case|error:|XCTAssert|Executed" "$screens/uitests.log" | tail -80 || true
          touch "$screens/.tests-done"
          xcrun xcresulttool export attachments --path build/UITests.xcresult --output-path "$screens/attachments" >/dev/null 2>&1 || true
          ls "$screens" | grep -E "^test-|^live-" | head -80 || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-screens
          path: screens

  testflight:
    if: github.event_name == 'push' || inputs.testflight
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/engine
      - name: XcodeGen
        run: brew install xcodegen
      - name: Data of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          release=https://github.com/$GITHUB_REPOSITORY/releases/download/$tag
          curl -sSfL -o rel.tar.gz $release/mb3d-rs-linux-x64.tar.gz
          curl -sSfL $release/SHA256SUMS | grep ' mb3d-rs-linux-x64.tar.gz$' | sed 's/mb3d-rs-linux-x64.tar.gz/rel.tar.gz/' > sum
          shasum -a 256 -c sum
          mkdir data && tar xzf rel.tar.gz -C data --strip-components=1 \
            "mb3d-rs-$tag-x86_64-unknown-linux-gnu/M3Formulas" "mb3d-rs-$tag-x86_64-unknown-linux-gnu/EM_JIT_M3Formulas" \
            "mb3d-rs-$tag-x86_64-unknown-linux-gnu/M3Maps" "mb3d-rs-$tag-x86_64-unknown-linux-gnu/M3Parameter"
      - name: Engine and project
        run: ios/build.sh "$PWD/data"
      # signed by hand with the team's distribution certificate and the App
      # Store profile (made through the API: an App Manager key may not use
      # Xcode's cloud signing); the API key only uploads
      - name: Signing certificate and profile
        env:
          DIST_P12: ${{ secrets.DIST_P12 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw=$(uuidgen)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APPSTORE_PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/OrbitTrap_AppStore.mobileprovision"
          security find-identity -v -p codesigning "$kc"
      - name: Archive, sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          auth=(-authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cd ios
          xcodebuild -project MB3D.xcodeproj -scheme MB3D -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OrbitTrap.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="Orbit Trap App Store" \
            archive | tail -40
          cat > "$RUNNER_TEMP/export.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>VZR9K6NY6T</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>io.github.thr32423.orbittrap</key><string>Orbit Trap App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OrbitTrap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}" | tail -40
          rm -f "$key"
