<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mb3d-rs</title>
<style>
:root {
  --bg: #16181d; --panel: #1f2229; --panel2: #262a33; --line: #343a46;
  --text: #dfe3ea; --dim: #8b93a3; --accent: #e0a24a; --accent2: #5aa0e6; --err: #ef6b6b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input, textarea { font: inherit; color: var(--text); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 4px; }
button { padding: 4px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: #7a5520; border-color: var(--accent); }
input, select { padding: 3px 5px; }
input[type=checkbox] { width: auto; }
input[type=color] { padding: 0; width: 34px; height: 22px; }
#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 6px 10px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
header .logo { font-weight: 700; color: var(--accent); margin-right: 8px; letter-spacing: .5px; }
header .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
#title { width: 180px; }
#status { margin-left: auto; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
#status.err { color: var(--err); }
main { display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
#viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#imgwrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
  overflow: hidden; background: #0d0e11; min-height: 0; outline: none; }
#img { width: 100%; height: 100%; object-fit: contain; cursor: crosshair; user-select: none;
  -webkit-user-drag: none; image-rendering: auto; }
#prog { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); width: 0; transition: width .15s; }
#hud { position: absolute; left: 8px; bottom: 6px; color: var(--dim); font-size: 12px; pointer-events: none;
  text-shadow: 0 1px 2px #000; }
#navbar { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 6px 10px;
  background: var(--panel); border-top: 1px solid var(--line); }
#navbar .grp { display: flex; gap: 3px; align-items: center; }
#navbar .grp > span { color: var(--dim); margin-right: 2px; }
#navbar button { padding: 3px 7px; min-width: 28px; }
#navbar input { width: 52px; }
aside { display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
#tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
#tabs button { border: 0; border-radius: 0; background: transparent; padding: 7px 7px; color: var(--dim); }
#tabs button.on { color: var(--text); box-shadow: inset 0 -2px var(--accent); }
#panel { flex: 1; overflow-y: auto; padding: 8px 10px 30px; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
.card h3 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.card h3 .sp { flex: 1; }
.card h3 button { padding: 1px 6px; font-size: 12px; }
.row { display: grid; grid-template-columns: 150px 1fr; gap: 6px; align-items: center; margin: 3px 0; }
.row label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row input[type=text] { width: 100%; min-width: 0; }
.row .multi input.num { width: 80px; }
.row .multi input[type=text] { width: 90px; flex: 1; }
#err { display: none; background: #4a1f22; color: #ffc9c9; border-bottom: 1px solid var(--err); padding: 6px 10px; }
#err.on { display: flex; gap: 8px; align-items: flex-start; }
#err span { flex: 1; white-space: pre-wrap; }
#err button { padding: 0 6px; }
.row > input[type=checkbox] { justify-self: start; }
.row .multi { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.pal { display: grid; grid-template-columns: 64px 36px 36px; gap: 3px 6px; align-items: center; }
.pal input[type=text] { width: 64px; }
.hint { color: var(--dim); font-size: 12px; margin: 4px 0 8px; }
.notes div { color: var(--dim); margin: 2px 0; }
textarea { width: 100%; padding: 6px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
#textarea { height: 60vh; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-width: 380px; }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog h2 { margin: 0 0 10px; font-size: 15px; }
dialog .actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }
.addrow { display: flex; gap: 4px; margin-top: 6px; }
.addrow input { flex: 1; min-width: 0; }
#finalprog { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 8px 0; }
#finalprog div { height: 100%; width: 0; background: var(--accent); }
.kf { display: grid; grid-template-columns: 104px 1fr; gap: 4px 8px; align-items: center; padding: 6px; border: 1px solid var(--line);
  border-radius: 5px; margin-bottom: 5px; background: var(--panel); }
.kf.sel { border-color: var(--accent2); }
.kf .th { width: 100px; height: 80px; background: #0d0e11; display: flex; align-items: center; justify-content: center; grid-row: span 2;
  border-radius: 3px; overflow: hidden; cursor: pointer; }
.kf .th img { max-width: 100px; max-height: 80px; }
.kf .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kf .meta b { color: var(--accent); }
.kf .meta input { width: 56px; }
.kf .btns { display: flex; gap: 3px; flex-wrap: wrap; }
.kf .btns button { padding: 2px 6px; font-size: 12px; }
.kfgap { text-align: center; color: var(--dim); font-size: 11px; margin: -3px 0 2px; }
#flipImg { display: block; max-width: 100%; margin: 6px auto; background: #0d0e11; min-height: 40px; }
.bar { height: 5px; background: var(--panel); border-radius: 3px; overflow: hidden; margin: 6px 0; }
.bar div { height: 100%; width: 0; background: var(--accent); }
.flipctl { display: flex; gap: 6px; align-items: center; }
.flipctl input[type=range] { flex: 1; }
.mtree { position: relative; width: 100%; background: #0d0e11; border-radius: 4px; margin: 6px 0; }
.mtree svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mtree .mm { position: absolute; transform: translate(-50%, -50%); border: 1px solid var(--line); border-radius: 3px;
  background: var(--panel); cursor: pointer; overflow: hidden; }
.mtree .mm img { display: block; width: 100%; }
.mtree .mm span { position: absolute; left: 2px; top: 1px; font-size: 10px; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.mtree .mm.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.mtree .mm.wait { aspect-ratio: 5 / 4; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 10px; }
#voxImg { display: block; width: min(240px, 100%); margin: 6px auto; background: #0d0e11; min-height: 40px; image-rendering: pixelated; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } aside { border-left: 0; } }
</style>
</head>
<body>
<div id="app">
<header>
  <span class="logo">mb3d-rs</span>
  <select id="preset" title="New scene from a built-in formula"><option value="">New…</option></select>
  <button id="bOpen" title="Open .m3p, .m3i, .m3s or text parameters">Open…</button>
  <input type="file" id="file" accept=".m3p,.m3i,.m3s,.txt" hidden>
  <button id="bPaste" title="Paste MB3D text parameters (Mandelbulb3Dv18{…}) or a .m3s scene">Paste…</button>
  <select id="save"><option value="">Save…</option><option value="m3s">scene (.m3s)</option><option value="m3p">MB3D parameters (.m3p)</option><option value="txt">MB3D text parameters</option></select>
  <span class="sep"></span>
  <button id="bUndo" title="Undo (Ctrl+Z)">↶</button><button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <label title="Width of the preview">view <select id="viewW"><option value="auto">fit</option><option>320</option><option>480</option><option>640</option><option>800</option><option>1024</option><option>1280</option></select></label>
  <button id="bRefresh" title="Calculate the preview again">⟳</button>
  <button id="bRender" class="primary">Render image…</button>
  <input id="title" type="text" title="Title (file name for saving)">
  <span id="status">starting…</span>
</header>
<main>
  <section id="viewer">
    <div id="imgwrap" tabindex="0">
      <img id="img" alt="" draggable="false">
      <div id="prog"></div>
      <div id="hud"></div>
    </div>
    <div id="navbar">
      <div class="grp"><span>move</span>
        <button data-nav="move,2,1" title="Forward (W, wheel)">fwd</button><button data-nav="move,2,-1" title="Back (S, wheel)">back</button>
        <button data-nav="move,0,-1" title="Left (A)">◀</button><button data-nav="move,0,1" title="Right (D)">▶</button>
        <button data-nav="move,1,-1" title="Up (R)">▲</button><button data-nav="move,1,1" title="Down (F)">▼</button>
        <input id="step" value="50" title="Step in % of the distance to the surface (Shift = ¼)">%</div>
      <div class="grp"><span>turn</span>
        <button data-nav="rotate,1,-1" title="Turn left (←)">⟲</button><button data-nav="rotate,1,1" title="Turn right (→)">⟳</button>
        <button data-nav="rotate,0,1" title="Look up (↑)">⤒</button><button data-nav="rotate,0,-1" title="Look down (↓)">⤓</button>
        <button data-nav="rotate,2,-1" title="Roll left (Q)">↺</button><button data-nav="rotate,2,1" title="Roll right (E)">↻</button>
        <input id="angle" value="10" title="Angle in degrees">°</div>
      <div class="grp"><span>zoom</span><button data-nav="zoom,0,1" title="Zoom in (+)">+</button><button data-nav="zoom,0,-1" title="Zoom out (−)">−</button></div>
      <div class="grp"><span>click</span><select id="clickMode" title="What a click into the image does">
        <option value="fly">flies towards the point</option><option value="look">turns to the point</option><option value="focus">sets the DOF focus</option></select></div>
    </div>
  </section>
  <aside>
    <div id="err"><span></span><button title="Dismiss">✕</button></div>
    <div id="tabs"></div>
    <div id="panel"></div>
  </aside>
</main>
</div>

<dialog id="dPaste">
  <h2>Paste parameters</h2>
  <div class="hint">MB3D text parameters (Mandelbulb3Dv18{…}) or the text of a .m3s scene.</div>
  <textarea id="pasteText" rows="12"></textarea>
  <div class="actions"><button id="pasteCancel">Cancel</button><button id="pasteOk" class="primary">Load</button></div>
</dialog>

<dialog id="dRender">
  <h2>Render image</h2>
  <div class="row"><label>size</label><div class="multi"><input id="rW" class="num" type="text"> × <input id="rH" class="num" type="text"></div></div>
  <div class="row"><label>anti-aliasing</label><select id="rAA"><option value="1">off</option><option value="2" selected>2×2</option><option value="3">3×3</option><option value="4">4×4</option></select></div>
  <div class="row"><label>tiles</label><input id="rTiles" type="text" placeholder="e.g. 4x4 for big images"></div>
  <div id="finalprog"><div></div></div>
  <div id="rInfo" class="hint">The image is calculated with the full settings of the scene.</div>
  <div class="actions"><a id="rDownload" href="/api/final.png" download hidden><button class="primary">Download PNG</button></a>
    <button id="rCancel">Stop</button><button id="rClose">Close</button><button id="rStart" class="primary">Start</button></div>
</dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null) e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k);
  return e;
};

// ------------------------------------------------------------ scene model
// The scene is .m3s text: global "key = value" lines, then [formula] and
// [light] sections.  The editors work on this list form and send the whole
// text back; the server answers with the normalised text.
let model = { global: [], sections: [] };
let sceneText = "";
let formulaNames = [];
let undoStack = [], redoStack = [];
let notes = [];

function parseM3s(text) {
  const m = { global: [], sections: [] };
  let cur = m.global;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith("#") || line.startsWith("//")) continue;
    const sec = line.match(/^\[(\w+)\]$/);
    if (sec) { const s = { type: sec[1].toLowerCase(), lines: [] }; m.sections.push(s); cur = s.lines; continue; }
    const semi = line.indexOf(";");
    const body = semi >= 0 ? line.slice(0, semi) : line;
    const comment = semi >= 0 ? line.slice(semi + 1).trim() : "";
    const eq = body.indexOf("=");
    if (eq < 0) continue;
    cur.push({ k: body.slice(0, eq).trim(), v: body.slice(eq + 1).trim(), c: comment });
  }
  return m;
}
function lineText(l) { return `${l.k} = ${l.v}` + (l.c ? ` ; ${l.c}` : ""); }
function toText(m) {
  let t = "# mb3d scene\n" + m.global.map(lineText).join("\n") + "\n";
  for (const s of m.sections) t += `\n[${s.type}]\n` + s.lines.map(lineText).join("\n") + "\n";
  return t;
}

// ------------------------------------------------------------ server calls
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ error: "bad response" }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
const post = (path, body) => api(path, { method: "POST", body });
const form = o => new URLSearchParams(o).toString();

function setStatus(t, err) { const s = $("status"); s.textContent = t; s.classList.toggle("err", !!err); }
function showError(msg) { $("err").querySelector("span").textContent = msg; $("err").classList.add("on"); }
function clearError() { $("err").classList.remove("on"); }

function applyState(st, fromUndo) {
  if (!fromUndo && sceneText && st.text !== sceneText) { undoStack.push(sceneText); if (undoStack.length > 200) undoStack.shift(); redoStack = []; }
  sceneText = st.text;
  clearError();
  model = parseM3s(st.text);
  if (st.title !== undefined && document.activeElement !== $("title")) $("title").value = st.title;
  if (st.notes) notes = st.notes;
  renderPanel();
  pollSoon();
  if (sentView) sendView(false);
}

async function commit(m = model) {
  const text = toText(m);
  try { applyState(await post("/api/scene", text)); }
  catch (e) { showError(e.message); model = parseM3s(sceneText); renderPanel(); }
}
async function sendText(text, fromUndo) {
  try { applyState(await post("/api/scene", text), fromUndo); } catch (e) { showError(e.message); }
}

// navigation requests run one after another
let navChain = Promise.resolve();
function nav(params) {
  navChain = navChain.then(async () => {
    try { applyState(await post("/api/nav", form(params))); }
    catch (e) { showError(e.message); }
  });
}

// ------------------------------------------------------------ status polling
let lastImg = -1, lastFinal = -1, pollTimer = null, rendering = false;
async function poll() {
  clearTimeout(pollTimer);
  try {
    const s = await api("/api/status");
    rendering = s.rendering;
    if (s.img_ver !== lastImg && s.img_ver > 0) { lastImg = s.img_ver; $("img").src = "/api/image?v=" + s.img_ver; }
    $("prog").style.width = s.rendering ? s.progress + "%" : "0";
    $("finalprog").firstElementChild.style.width = s.rendering ? s.progress + "%" : (s.final_ver > 0 ? "100%" : "0");
    if (s.error) setStatus(s.error, true);
    else setStatus((s.rendering ? `${s.stage} · ${s.progress.toFixed(0)} %` : s.stage) || "");
    $("hud").textContent = s.w ? `${s.w} × ${s.h}` : "";
    if (s.final_ver !== lastFinal) {
      if (lastFinal >= 0 && s.final_ver > 0) { $("rDownload").hidden = false; $("rInfo").textContent = "Done: " + s.stage; }
      lastFinal = s.final_ver;
    }
  } catch (e) { setStatus("server not reachable", true); }
  pollTimer = setTimeout(poll, rendering ? 150 : 700);
}
function pollSoon() { clearTimeout(pollTimer); pollTimer = setTimeout(poll, 60); }

// ------------------------------------------------------------ editor widgets
const ENUMS = {
  ao: ["off", "ssao24", "ssao24t0", "ssao15", "ssao15t0", "deao"],
  inside: ["outside", "inside", "both"],
  slice_2d: ["off", "start", "mid", "end"],
  stereo: ["off", "left", "right", "very_left"],
  de_combination: ["off", "min", "max", "max_inverted", "smooth_linear", "smooth", "mix"],
  dof: ["off", "sorted", "forward"],
  optic: ["0", "1", "2"],
  diffuse_map_mode: ["iterations_otrap", "normals", "wrap_sine", "wrap"],
  depth_func: ["0", "1", "2", "3"],
  diffuse_func: ["0", "1", "2", "3"],
  visible: ["0", "1", "2", "3", "4"],
};
const LABELS = { stereo: "stereo eye image", stereo_screen: "stereo screen width, distance, min. distance (m)", slice_2d: "2D calculation of the plane at", color_on_iteration: "colour on iteration (-1 off)", interpolation: "interpolation hybrid (weights of formula 1, 2)", optic: "optic (0 common, 1 planar, 2 panorama)", fov: "field of view (°)", de_stop: "DE stop (pixels)",
  raystep: "raystep multiplier", vgrads: "view matrix", mid: "middle", julia_c: "julia constant (x, y, z, w)" };

const GROUPS = [
  ["Camera", /^(width|height|zoom|mid|z_start|z_end|slice_2d|stereo|stereo_screen|vgrads|rotation|fov|optic|cut_[xyz]|tiles|tile|tile_downscale)$/],
  ["Formula iteration", /^(iterations|min_iterations|rstop|julia|julia_c|rotation_4d|repeat_from|inside|interpolation|de_combination|decomb_.*|color_option|color_mul|color_on_iteration|dfog_on_it)$/],
  ["Ray marching", /^(de_stop|raystep|raystep_limiter|smooth_normals|bin_search|first_step_random|step_sub_de_stop|vary_de_stop|normals_on_de|disable_analytic_de|threads)$/],
  ["Ambient occlusion and shadows", /^(ao|ao_.*|deao_.*|shadows|shadow_.*)$/],
  ["Depth of field and volumetric light", /^(dof|dof_.*|vol_light|vol_light_.*)$/],
  ["Colours", /^(color_start|color_end|color_cycling|color_var_z|color_on_otrap|color_interpolation|palette_full|palette|interior_.*|fine_color_adjust|diffuse_map.*)$/],
  ["Light and fog", /^(ambient.*|depth_.*|dynfog.*|dyn_fog|fog_offset|far_fog|diffuse|specular|indirect_light|gamma|roughness|diffuse_shadowing|internal_gamma2|light_mode|lights)$/],
  ["Background", /^background.*$/],
];
const TABS = [
  ["Formulas", () => formulasTab()],
  ["Camera", () => globalTab(["Camera", "Formula iteration"])],
  ["Render", () => globalTab(["Ray marching", "Ambient occlusion and shadows", "Depth of field and volumetric light"])],
  ["Colours", () => globalTab(["Colours", "Background"])],
  ["Lights", () => lightsTab()],
  ["Animation", () => animTab()],
  ["MutaGen", () => mutaTab()],
  ["Export", () => exportTab()],
  ["All", () => globalTab(null)],
  ["Text", () => textTab()],
  ["Info", () => infoTab()],
];
let tab = "Formulas";
const KNOWN_KEYS = ["inside", "interpolation", "slice_2d", "stereo", "stereo_screen", "color_on_iteration", "de_combination", "decomb_end1", "decomb_start2", "decomb_end2", "decomb_repeat2", "decomb_iterations2",
  "decomb_smooth", "decomb_mix_pow", "decomb_mix_color", "cut_x", "cut_y", "cut_z", "shadows", "shadow_soft", "shadow_soft_radius",
  "shadow_max_len", "shadow_set_cos", "ao_random", "deao_quality", "deao_dither", "deao_max_len", "dof_focus", "dof_focus2",
  "dof_aperture", "dof_max_radius", "dof_passes", "vol_light", "vol_light_map_size", "background_image", "background_rotation",
  "background_direct", "background_brightness", "background_add_light", "background_ambient", "diffuse_map", "diffuse_map_mode",
  "diffuse_map_offset", "diffuse_map_rotation", "diffuse_map_scale", "diffuse_map_brightness_only", "internal_gamma2",
  "color_interpolation", "ambient_relative_to_object", "dynfog_options", "light_mode", "fine_color_adjust", "rstop", "tiles", "tile",
  "rotation", "lights"];

function groupOf(k) { for (const [g, re] of GROUPS) if (re.test(k)) return g; return "Other"; }

function nudge(input, dir, big) {
  const v = input.value.trim();
  if (!/^-?\d*\.?\d+(e-?\d+)?$/i.test(v)) return false;
  const n = parseFloat(v);
  const isInt = /^-?\d+$/.test(v);
  let d = isInt ? (big ? 10 : 1) : Math.max(Math.abs(n) * (big ? 0.1 : 0.01), 1e-6);
  let r = n + dir * d;
  input.value = isInt ? String(Math.round(r)) : String(+r.toPrecision(10));
  return true;
}

// one value editor; onset(newValue) commits
function valueWidget(key, value, onset, id) {
  const v = value;
  if (ENUMS[key] || (key === "shadows" && false)) {
    const sel = el("select", { id, onchange: () => onset(sel.value) });
    const opts = ENUMS[key].includes(v) ? ENUMS[key] : [v, ...ENUMS[key]];
    for (const o of opts) sel.append(el("option", { value: o }, o));
    sel.value = v;
    return sel;
  }
  if (v === "true" || v === "false") {
    const cb = el("input", { type: "checkbox", id, onchange: () => onset(cb.checked ? "true" : "false") });
    cb.checked = v === "true";
    return cb;
  }
  if (/^#[0-9a-f]{6}$/i.test(v)) {
    const wrap = el("div", { class: "multi" });
    const ci = el("input", { type: "color", id, value: v.toLowerCase() });

  const sl = $("flipSlider"); if (sl) sl.max = Math.max(0, f.total - 1);
  if (!flip.playing) flipShow(flip.pos);
  const jb = $("jobBar"); if (jb) jb.firstElementChild.style.width = j.total ? (100 * (j.done + j.skipped + (j.running ? j.progress / 100 : 0)) / j.total) + "%" : "0";
  const js = $("jobState");
  if (js) {
    let t = "";
    if (j.total) {
      const n = j.done + j.skipped;
      t = j.running ? `frame ${j.current} of ${j.total} · ${j.progress.toFixed(0)} %` : `${j.done} rendered, ${j.skipped} skipped of ${j.total}`;
      if (j.done && j.running) { const per = j.seconds / Math.max(1, n); t += ` · about ${fmtTime(per * (j.total - n))} left`; }

$("pasteOk").onclick = async () => {
  try { applyState(await post("/api/open?name=pasted.txt", $("pasteText").value)); $("dPaste").close(); if (notes.length) { tab = "Info"; renderPanel(); } }
  catch (e) { alert(e.message); }
};
$("save").onchange = () => { const f = $("save").value; $("save").value = ""; if (f) location.href = "/api/save?fmt=" + f; };
$("preset").onchange = async () => {
  const n = $("preset").value; $("preset").value = "";
  if (n) try { applyState(await post("/api/preset", form({ name: n }))); } catch (e) { setStatus(e.message, true); }
};
function viewWidth() {
  const v = $("viewW").value;
  if (v !== "auto") return +v;
  const g = k => parseFloat((model.global.find(l => l.k === k) || { v: "4" }).v) || 4;
  const aspect = g("width") / g("height");
  return Math.max(64, Math.min(1600, Math.round(Math.min(wrap.clientWidth, wrap.clientHeight * aspect))));
}
let sentView = 0;
async function sendView(force) {
  const w = viewWidth();
  if (!force && Math.abs(w - sentView) < 24) return;
  sentView = w;
  try { await post("/api/view", form({ w })); pollSoon(); } catch (e) { setStatus(e.message, true); }
}
$("viewW").onchange = () => sendView(true);
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => sendView(false), 400); });
$("bRefresh").onclick = async () => { await post("/api/refresh", ""); pollSoon(); };
$("title").onchange = () => post("/api/title", $("title").value);

$("bRender").onclick = () => {
  const g = k => (model.global.find(l => l.k === k) || { v: "" }).v;
  $("rW").value = g("width"); $("rH").value = g("height"); $("rTiles").value = g("tiles");
  $("rDownload").hidden = true; $("rInfo").textContent = "The image is calculated with the full settings of the scene.";
  $("dRender").showModal();
};
$("rClose").onclick = () => $("dRender").close();
$("rCancel").onclick = async () => { await post("/api/cancel", ""); $("rInfo").textContent = "Stopped."; pollSoon(); };
$("rStart").onclick = async () => {
  const set = (k, v) => { const l = model.global.find(x => x.k === k); if (v === "") { if (l) model.global.splice(model.global.indexOf(l), 1); } else if (l) l.v = v; else model.global.push({ k, v, c: "" }); };
  set("width", $("rW").value.trim()); set("height", $("rH").value.trim());
  model.global = model.global.filter(l => l.k !== "tile");
  set("tiles", $("rTiles").value.trim());
  await commit();
  await post("/api/render", form({ aa: $("rAA").value }));
  $("rDownload").hidden = true; $("rInfo").textContent = "Rendering…";
  pollSoon();
};

$("err").querySelector("button").onclick = clearError;

// ------------------------------------------------------------ start
(async () => {
  try {
    const f = await api("/api/formulas");
    formulaNames = [...f.builtin, ...f.custom];
    const dl = el("datalist", { id: "formulaList" });
    for (const n of formulaNames) dl.append(el("option", { value: n }));
    document.body.append(dl);
    for (const n of f.builtin) $("preset").append(el("option", { value: n }, n));
    const kk = el("datalist", { id: "knownKeys" });
    for (const k of KNOWN_KEYS) kk.append(el("option", { value: k }));
    document.body.append(kk);
    applyState(await api("/api/state"), true);
    await sendView(true);
  } catch (e) { setStatus(e.message, true); }
  poll();
})();
</script>
</body>
